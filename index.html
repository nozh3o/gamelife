<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>One</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e1016" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f4fa" media="(prefers-color-scheme: light)">
<meta name="description" content="Личный трекер: задачи и привычки, цели, финансы, питание и дневник.">

<!-- иконки на домашнем экране -->
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- iOS: запуск как отдельное приложение, без адресной строки -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="One">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="toastRoot" class="toast-root"></div>
<div id="fxRoot" class="fx-root"></div>
<div id="modalRoot"></div>

<button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Меню">☰</button>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-icon">1️⃣</span>
      <span class="brand-name">One</span>
    </div>

    <nav class="nav" id="mainNav">
      <div class="nav-indicator" id="navIndicator"></div>
      <button class="nav-btn active" data-tab="home"><span class="nav-ic">🏠</span><span>Главная</span></button>
      <button class="nav-btn" data-tab="tasks"><span class="nav-ic">✅</span><span>Задачи</span></button>
      <button class="nav-btn" data-tab="goals"><span class="nav-ic">🎯</span><span>Цели</span></button>
      <button class="nav-btn" data-tab="wishes"><span class="nav-ic">🌠</span><span>Карта желаний</span></button>
      <button class="nav-btn" data-tab="journal"><span class="nav-ic">📔</span><span>Журнал</span></button>

      <div class="nav-group-label">Ресурсы</div>
      <button class="nav-btn" data-tab="finance"><span class="nav-ic">💰</span><span>Финансы</span></button>
      <button class="nav-btn" data-tab="nutrition"><span class="nav-ic">🥗</span><span>Питание</span></button>
      <button class="nav-btn" data-tab="workouts"><span class="nav-ic">🏋️</span><span>Тренировки</span></button>
      <button class="nav-btn" data-tab="stats"><span class="nav-ic">📊</span><span>Аналитика</span></button>
      <button class="nav-btn" data-tab="settings"><span class="nav-ic">⚙️</span><span>Настройки</span></button>
    </nav>

    <div class="sidebar-footer">
      <div id="syncBadge"></div>
      <span id="todayDate"></span>
    </div>
  </aside>

  <main class="content" id="content"></main>
</div>

<nav class="bottom-nav" id="bottomNav">
  <div class="bn-indicator" id="bnIndicator"></div>
  <button class="nav-btn bn-btn" data-tab="home"><span class="bn-ic">🏠</span><span class="bn-label">Главная</span></button>
  <button class="nav-btn bn-btn" data-tab="tasks"><span class="bn-ic">✅</span><span class="bn-label">Задачи</span></button>
  <button class="nav-btn bn-btn" data-tab="finance"><span class="bn-ic">💰</span><span class="bn-label">Финансы</span></button>
  <button class="nav-btn bn-btn" data-tab="nutrition"><span class="bn-ic">🥗</span><span class="bn-label">Питание</span></button>
  <button class="bn-btn bn-more" id="bottomMoreBtn"><span class="bn-ic">☰</span><span class="bn-label">Ещё</span></button>
</nav>

<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/engine.js"></script>
<script src="js/phrases.js"></script>
<script src="js/views-home.js"></script>
<script src="js/views-tasks.js"></script>
<script src="js/views-goals.js"></script>
<script src="js/views-wishes.js"></script>
<script src="js/views-workouts.js"></script>
<script src="js/food-db.js"></script>
<script src="js/views-nutrition.js"></script>
<script src="js/views-finance.js"></script>
<script src="js/views-stats.js"></script>
<script src="js/views-journal.js"></script>
<script src="js/views-settings.js"></script>
<script src="js/sync.js"></script>
<script src="js/main.js"></script>
</body>
</html>
